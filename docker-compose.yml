version: "3.12"


services:
  backend:
    build: .
    container_name: backend3
    command: python manage.py runserver 0.0.0.0:8020
    volumes:
      - ./core:/app
    working_dir: /app
    ports:
      - "8020:8020"
    environment:
      - SECRET_KEY=test
      - DEBUG=True

  
  smtp:
    image: rnwood/smtp4dev
    container_name: smtp4dev2_blog
    ports:
      - "6025:25"
      - "5001:80"
    restart: unless-stopped

