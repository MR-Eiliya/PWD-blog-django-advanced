version: "3.12"
services:
  backend:
    build: .
    container_name: backend3
    command: python manage.py runserver 0.0.0.0:8020
    volumes:
      - ./core:/app
    working_dir: /app
    ports:
      - "8020:8020"
    environment:
      - SECRET_KEY=test
      - DEBUG=True

  
  smtp:
    image: rnwood/smtp4dev
    container_name: smtp4dev2_blog
    ports:
      - "6025:25"
      - "5001:80"
    restart: unless-stopped



  redis:
    image: redis:7-alpine
    container_name: redis_blog
    ports:
      - "6379:6379"
    restart: unless-stopped

  celery:
    build: .
    container_name: celery_worker
    command: celery -A core worker --loglevel=info
    volumes:
      - ./core:/app
    working_dir: /app
    environment:
      - SECRET_KEY=test
      - DEBUG=True
    depends_on:
      - redis

