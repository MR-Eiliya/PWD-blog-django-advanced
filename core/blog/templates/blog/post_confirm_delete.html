{% extends 'base.html' %}

{% block content %}

<div class="site-section">
    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="sidebar-box" style="background-color: rgb(32, 32, 32); border-radius: 15px; padding: 30px; text-align: center;">

                    <h2 style="color: #ff4d4d; margin-bottom: 20px;">
                        Delete Post
                    </h2>

                    <p style="color: white; margin-bottom: 30px;">
                        Are you sure you want to delete this post?
                    </p>

                    <h4 style="color: #fff;">
                        "{{ object.title }}"
                    </h4>

                    <form method="post">
                        {% csrf_token %}

                        <div style="margin-top: 30px;">
                            <button type="submit" class="btn btn-danger">
                                Yes, Delete
                            </button>

                            <a href="{% url 'blog:home' %}" class="btn btn-secondary">
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>
</div>

{% endblock %}
